services:
  database:
    image: postgres:18.2-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - "./docker/db/postgresql:/var/lib/postgresql/data"
    ports:
      - "5532:${DATABASE_PORT}"
    environment:
      POSTGRES_PASSWORD: "${DATABASE_PASSWORD}"
      POSTGRES_USER: "${DATABASE_USER}"
      POSTGRES_DB: "${DATABASE_NAME}"

  php:
    build:
      context: ./docker/php
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/9000'"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - ".:/var/www/html"
      - "~/.composer:/home/docker/.composer"
      - "~/.ssh:/home/docker/.ssh"
    depends_on:
      database:
        condition: service_healthy

  nginx:
    image: nginx:1.29.5-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ".:/var/www/html"
      - "./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf"
    depends_on:
      php:
        condition: service_healthy

  # Dev only: Vite dev server with HMR. The host `npm run dev` works too.
  # Production assets are built with `make frontend-build` and served by nginx.
  frontend:
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY_TARGET: http://nginx:80
    ports:
      - "${FRONTEND_PORT}:5173"
    volumes:
      - "./frontend:/app"
      - frontend_node_modules:/app/node_modules
    depends_on:
      php:
        condition: service_healthy

  mailer:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "1126:1025"
      - "1181:8025"

volumes:
  frontend_node_modules: