server {
    listen 80;
    server_name localhost;

    # Production frontend: built React SPA (make frontend-build).
    # In dev, access the app through the Vite dev server (http://localhost:5173).
    root /var/www/html/frontend/dist;
    index index.html;

    error_log /var/log/nginx/project_error.log;
    access_log /var/www/html/var/log/nginx_access.log;

    # SPA: serve the built assets, fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Symfony API (API Platform resources + /api/login, /api/register, /api/me).
    location /api {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}